name: Live fantasy synchronization

on:
  schedule:
    # Offset from the top of the hour, when GitHub warns scheduled runs are
    # most likely to be delayed or dropped under load.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-fantasy-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.LIVE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.LIVE_DATABASE_URL }}
      CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the Supabase transaction pooler
        run: |
          node -e 'const fs = require("node:fs"); const url = new URL(process.env.DATABASE_URL); if (url.hostname.endsWith(".pooler.supabase.com")) url.port = "6543"; fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${url.toString()}\n`);'
      - name: Queue due stage synchronizations
        run: npm run jobs:schedule
      - name: Process the oldest queued operator job
        run: npm run jobs:work
